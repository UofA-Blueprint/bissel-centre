name: CI/CD Pipeline

# Trigger the workflow on pushes to main and staging, and on pull requests to staging.
on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - staging

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
      IT_ID_HASH_PEPPER: ${{ secrets.IT_ID_HASH_PEPPER }}
    steps:
      # Step 1: Checkout the code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v7

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm install

      #Step 4: Install Browsers for Playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Step 4: Lint the code
      - name: Run Lint
        run: npm run lint

      # Step 5: Run Unit Tests with Jest
      - name: Run Unit Tests
        run: npm run test

      # Step 5b: Firestore security rules, exercised against the emulator.
      # Marked non-blocking until we have a green baseline in CI — once it
      # passes, delete continue-on-error so a rules regression fails the build.
      # firebase-tools refuses to start the emulator on anything below Java 21.
      # Pinned to setup-java v5 on purpose: v6 is still flagged as not
      # recommended for production workflows.
      - name: Setup Java (required by the Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Firestore Rules Tests
        continue-on-error: true
        run: npm run test:rules

      # Step 6: Build the Next.js App (this also verifies build success)
      - name: Build Next.js App
        run: npm run build

      # Step 7: Run End-to-End Tests with Playwright
      - name: Run E2E Tests
        run: npm run test:e2e

  deploy:
    name: Deploy to Vercel
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }} # Vercel API token
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }} # Vercel organization ID
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }} # Vercel project ID
          # --prod must come ONLY from this conditional. A literal --prod here
          # would send staging builds to the production domain.
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
